<script>
/* 按网址填板块名、介绍，并让侧栏里对应的板块亮起来 */
(function () {
  var BOARDS = {
    aoshu: ['奥数', '一年级思维课，一天一课：先看 5 分钟以内的讲解视频，再做练习，最后家长对着分步解析讲题。'],
    shizi: ['识字', '每日一卷 20 个字，没认出的字自动安排复习；还能出田字格练字纸，带笔顺和描红。'],
    pinyin: ['拼音', '易混字母、声调、拼读，按孩子读错的音节安排下一组；卡住时有家长教学卡。'],
    huochai: ['火柴', '拿走、添上或移动一根火柴，让算式变对。四关由易到难，每道题只有一个答案。'],
    mima: ['密码', '看几条线索，一步步排除，推出密码。练的是推理。'],
    migong: ['迷宫', '算式迷宫：只有算对的格子才能踩，走到出口就是全对。'],
    zhizhi: ['数织', '按数字线索涂格子，涂完揭晓一幅小图。']
  }
  var key = location.pathname.replace(/\/+$/, '').replace(/\.html$/, '').replace(/^\//, '')
  var b = BOARDS[key]
  if (b) {
    document.title = b[0] + ' · 完整版 · 纸和笔'
    document.getElementById('lk-title').textContent = b[0]
    document.getElementById('lk-name').textContent = b[0]
    document.getElementById('lk-desc').textContent = b[1]
    var link = document.querySelector('.rail-link[data-module="' + b[0] + '"]')
    if (link) { link.classList.add('active'); link.setAttribute('aria-current', 'page') }
  }
})()
</script>
