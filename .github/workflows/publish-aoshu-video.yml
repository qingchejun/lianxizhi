# 奥数讲解视频一键上线：推送 publish/<id> 分支即触发。
#
# 分支结构（Claude 准备，用户在对话里说「上线」后推送）：
#   （.mp4 被 .gitignore 忽略，素材要用 git add -f）
#   origin/main ── 登记提交（js/aoshu-videos.js 等，可以没有）── 素材提交（只加 _publish/<id>.mp4、可选 _publish/<id>.jpg）← 分支顶端
#
# 流程：检查文件（moov 在前）→ 传到 R2 的 aoshu/<id>.mp4 / .jpg → 确认 video.qingchejun.com 能取到、大小一致
#      → 把登记提交（不含素材）变基到最新 main 并推送（Cloudflare Pages 自动部署）→ 删掉 publish/<id> 分支。
# 视频文件只经过这个临时分支，不会进 main。
#
# 一次性设置（仓库 Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   只给 R2 编辑权限的 API 令牌
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
name: 上线奥数讲解视频

on:
  push:
    branches: ['publish/**']

permissions:
  contents: write

concurrency:
  group: publish-aoshu-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读分支名和素材
        id: meta
        run: |
          ID="${GITHUB_REF_NAME#publish/}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          test -f "_publish/$ID.mp4" || { echo "::error::缺少 _publish/$ID.mp4"; exit 1; }
          # 顶端提交只能动 _publish/，防止把别的改动当素材扔掉
          if git diff --name-only HEAD~1 HEAD | grep -v '^_publish/'; then echo "::error::顶端提交里有 _publish/ 以外的改动"; exit 1; fi
          python3 - "_publish/$ID.mp4" <<'EOF'
          import sys
          d = open(sys.argv[1], 'rb').read(2_000_000)
          m, k = d.find(b'moov'), d.find(b'mdat')
          if m < 0 or (k >= 0 and k < m):
              sys.exit('::error::moov 不在 mdat 前面，先用 ffmpeg -movflags +faststart 重新封装')
          print('moov 在前 ✓')
          EOF
          ls -la _publish

      - name: 传到 R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID="${{ steps.meta.outputs.id }}"
          npx --yes wrangler@4 r2 object put "lianxizhi-video/aoshu/$ID.mp4" --file="_publish/$ID.mp4" --content-type=video/mp4 --remote
          if [ -f "_publish/$ID.jpg" ]; then
            npx --yes wrangler@4 r2 object put "lianxizhi-video/aoshu/$ID.jpg" --file="_publish/$ID.jpg" --content-type=image/jpeg --remote
          fi

      - name: 确认线上能取到
        run: |
          ID="${{ steps.meta.outputs.id }}"
          for ext in mp4 jpg; do
            f="_publish/$ID.$ext"; [ -f "$f" ] || continue
            want=$(stat -c %s "$f")
            got=$(curl -fsSI "https://video.qingchejun.com/aoshu/$ID.$ext?v=$GITHUB_RUN_ID" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
            echo "$ID.$ext 本地 $want 字节，线上 $got 字节"
            [ "$want" = "$got" ] || { echo "::error::线上文件大小不一致"; exit 1; }
          done

      - name: 登记提交推到 main
        run: |
          ID="${{ steps.meta.outputs.id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BASE=$(git merge-base origin/main HEAD~1)
          if [ "$(git rev-parse HEAD~1)" = "$BASE" ]; then
            echo "没有登记改动（只换了视频文件），不用推 main"
          else
            git checkout -B out HEAD~1
            git rebase origin/main
            node tools/check-today.js
            git push origin out:main
          fi

      - name: 删掉临时分支
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
